<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <filter id="cordShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.4"/>
    </filter>
    <filter id="contactShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <g fill="none" stroke-linecap="round">
    <!-- Soft cast shadows on the fabric. -->
    <path d="M 566 312 C 556 372 574 418 592 462 C 572 512 552 560 548 630" stroke="#000" stroke-opacity=".24" stroke-width="15" filter="url(#contactShadow)" transform="translate(5,6)"/>
    <path d="M 622 320 C 634 378 614 420 589 462 C 612 512 630 558 640 634" stroke="#000" stroke-opacity=".28" stroke-width="16" filter="url(#contactShadow)" transform="translate(5,7)"/>

    <!-- Left cord. -->
    <path d="M 566 312 C 556 372 574 418 592 462 C 572 512 552 560 548 630" stroke="#3d5578" stroke-width="7"/>
    <path d="M 566 312 C 556 372 574 418 592 462 C 572 512 552 560 548 630" stroke="#b0c0d6" stroke-opacity=".22" stroke-width="2.2" transform="translate(-1,-1)"/>

    <!-- Right cord sits lightly on top at the crossing. -->
    <path d="M 622 320 C 634 378 614 420 589 462 C 612 512 630 558 640 634" stroke="#3d5578" stroke-width="7.3"/>
    <path d="M 622 320 C 634 378 614 420 589 462 C 612 512 630 558 640 634" stroke="#b0c0d6" stroke-opacity=".26" stroke-width="2.2" transform="translate(-1,-1)"/>

    <!-- Short, darker contact shadow under the right cord where it crosses. -->
    <path d="M 615 440 C 604 452 596 458 590 465" stroke="#000" stroke-opacity=".14" stroke-width="13" filter="url(#cordShadow)"/>
  </g>
  <g stroke="#5f5546" stroke-width="1.3" fill="#b0a491">
    <rect x="-5.2" y="-13" width="10.4" height="26" rx="5.2" transform="translate(548 632) rotate(6)"/>
    <rect x="-5.2" y="-13" width="10.4" height="26" rx="5.2" transform="translate(640 636) rotate(-4)"/>
  </g>
</svg>